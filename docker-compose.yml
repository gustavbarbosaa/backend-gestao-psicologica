version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: db_gestao_psicologica
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: db_gestao_psicologica
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
