name: CI/CD Backend
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Build Gradle
        run: ./gradlew clean build

  deploy:
    name: Deploy na EC2 - AWS
    runs-on: ubuntu-22.04
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Executando deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: '22'
          script: |
            cd /home/ec2-user/gestao_psico
            
            git -C backend-gestao-psicologica pull origin main
            
            docker-compose build backend_gestao_psicologica
            
            docker-compose up -d backend_gestao_psicologica
            
            docker image prune -f
