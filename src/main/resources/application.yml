server:
  port: ${PORT:8080}

app:
  secret: ${APP_SECRET}
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      name: ${ADMIN_NAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

spring:
  application:
    name: "gestao_psicologica"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          timezone: "America/Fortaleza"

springdoc:
  api-docs:
    enabled: ${app.security.swagger-enabled:false}
  swagger-ui:
    enabled: ${app.security.swagger-enabled:false}
